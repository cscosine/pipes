name: Trigger downstream repo cscosine/3rdPartyBaseLibs

on:
  # 1️⃣ Push & PR
  push:
    branches: [ "cs-main" ]
  pull_request:
    branches: [ "cs-main" ]

  # 2️⃣ Manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual"

  # 3️⃣ Scheduled trigger (weekly)
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC

  # 4️⃣ Triggered by other repositories
  repository_dispatch:
    types: [ dependent-repo-change ]

# 🔒 Prevent duplicate / overlapping runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:

      - name: Trigger downstream repo cscosine/3rdPartyBaseLibs
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ACTIONS_ORG_ACCESS }}" \
            https://api.github.com/repos/cscosine/3rdPartyBaseLibs/dispatches \
            -d '{
              "event_type": "dependent-repo-change",
              "client_payload": {
                "source_repo": "pipes",
                "commit": "${{ github.sha }}"
              }
            }'
