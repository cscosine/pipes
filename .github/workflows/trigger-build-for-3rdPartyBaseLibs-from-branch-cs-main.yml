name: Trigger downstream repo cscosine/3rdPartyBaseLibs

on:
  # 1️⃣ Push & PR
  push:
    branches: [ "cs-main" ]
  pull_request:
    branches: [ "cs-main" ]

  # 2️⃣ Manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual"

# 🔒 Prevent duplicate / overlapping runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:

      - name: Trigger downstream repo cscosine/3rdPartyBaseLibs
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.ACTIONS_ORG_ACCESS }}" \
            https://api.github.com/repos/cscosine/3rdPartyBaseLibs/actions/workflows/full-build.yml/dispatches \
            -d '{
              "ref": "${{ github.ref_name }}",
              "inputs": {
                "source_repo": "pipes",
                "source_branch": "${{ github.ref_name }}",
                "source_commit": "${{ github.sha }}"
              }
            }'
